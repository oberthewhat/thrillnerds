[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Specific redirects FIRST (order matters) ---

[[redirects]]
  from = "/milliesbirthday"
  to = "/milliesbirthday.html"
  status = 200

# Blog pages are real static files in dist/blog/ — serve them directly,
# so the SPA catch-all below never swallows them.
[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat"
  status = 200

# --- SPA catch-all LAST (only one, at the very end) ---

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200